<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1320" viewBox="0 0 500 1320" role="img" aria-labelledby="title desc">
  <title id="title">Recommended release verification, narrow layout</title>
  <desc id="desc">Pin a release, verify the checksum manifest signature and expected workflow identity, compare the archive SHA-256 and inspect the installed executable. Require both manual checks. Artifact trust and workspace evidence are separate. The convenience installer can continue without all checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5B3EE0" />
    </marker>
  </defs>
  <rect width="500" height="1320" rx="22" fill="#F6F4EF" />
  <text x="24" y="38" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">SYNAPSE / DISTRIBUTION TRUST</text>
  <text x="24" y="82" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="31" font-weight="650">Trust the download.</text>
  <text x="24" y="122" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="31" font-weight="650">Inspect the memory.</text>
  <text x="24" y="164" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="400">Manual flow: require both checks.</text>
  <rect x="24" y="205" width="452" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="46" y="235" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">SELECT</text>
  <text x="46" y="273" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Pin a release</text>
  <text x="46" y="313" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Choose version and platform</text>
  <text x="46" y="341" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Download archive + manifest</text>
  <path d="M250 377 V415" stroke="#5B3EE0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <rect x="24" y="415" width="452" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="46" y="445" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">AUTHENTICATE</text>
  <text x="46" y="483" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Verify the signed manifest</text>
  <text x="46" y="523" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Check cosign workflow identity</text>
  <text x="46" y="551" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Require signature verification</text>
  <path d="M250 587 V625" stroke="#5B3EE0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <rect x="24" y="625" width="452" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="46" y="655" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">COMPARE</text>
  <text x="46" y="693" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Check archive SHA-256</text>
  <text x="46" y="733" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Match the selected archive entry</text>
  <text x="46" y="761" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Require checksum agreement</text>
  <path d="M250 797 V835" stroke="#5B3EE0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <rect x="24" y="835" width="452" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="46" y="865" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">RUN AND INSPECT</text>
  <text x="46" y="903" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Use the pinned executable</text>
  <text x="46" y="943" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Inspect installed commands</text>
  <text x="46" y="971" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Run supported workspace checks</text>
  <rect x="24" y="1045" width="452" height="160" rx="14" fill="#FFB454" stroke="#FFB454" stroke-width="2" />
  <text x="46" y="1080" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">ARTIFACT TRUST IS ONE LAYER</text>
  <text x="46" y="1118" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="21" font-weight="400">Workspace checks are separate.</text>
  <text x="46" y="1151" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="400">Signatures and hashes do not</text>
  <text x="46" y="1180" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="400">establish the truth of claims.</text>
  <text x="24" y="1252" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">INSTALLER LIMIT</text>
  <text x="24" y="1285" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">The script can continue without all checks.</text>
</svg>
