<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="925" viewBox="0 0 1000 925" role="img" aria-labelledby="title desc">
  <title id="title">Recommended release verification workflow</title>
  <desc id="desc">Choose a pinned release, authenticate SHA256SUMS with cosign and the expected workflow identity, compare the selected archive SHA-256, and only then use the pinned executable. Workspace verification is separate. The convenience installer is best-effort and can continue without all checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5B3EE0" />
    </marker>
  </defs>
  <rect width="1000" height="925" rx="22" fill="#F6F4EF" />
  <text x="38" y="43" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="16" font-weight="650">SYNAPSE / DISTRIBUTION TRUST</text>
  <text x="38" y="92" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="34" font-weight="650">Trust the download. Inspect the memory.</text>
  <text x="38" y="133" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="22" font-weight="400">Recommended manual verification has two independent checks.</text>
  <rect x="38" y="184" width="444" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="60" y="214" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">SELECT</text>
  <text x="60" y="252" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Pin a release</text>
  <text x="60" y="292" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Choose the version and platform</text>
  <text x="60" y="320" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Download the archive + manifest</text>
  <rect x="518" y="184" width="444" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="540" y="214" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">AUTHENTICATE</text>
  <text x="540" y="252" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Verify the signed manifest</text>
  <text x="540" y="292" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Check cosign workflow identity</text>
  <text x="540" y="320" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Require signature verification</text>
  <path d="M482 270 H518" stroke="#5B3EE0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <rect x="518" y="416" width="444" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="540" y="446" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">COMPARE</text>
  <text x="540" y="484" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Check the archive SHA-256</text>
  <text x="540" y="524" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Match the selected archive entry</text>
  <text x="540" y="552" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Require checksum agreement</text>
  <rect x="38" y="416" width="444" height="172" rx="14" fill="#FFFFFF" stroke="#D5CFE5" stroke-width="2" />
  <text x="60" y="446" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">RUN AND INSPECT</text>
  <text x="60" y="484" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="650">Use the pinned executable</text>
  <text x="60" y="524" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Inspect installed commands</text>
  <text x="60" y="552" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Run supported workspace checks</text>
  <path d="M740 356 V416" stroke="#5B3EE0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M518 502 H482" stroke="#5B3EE0" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <rect x="38" y="635" width="924" height="124" rx="14" fill="#FFB454" stroke="#FFB454" stroke-width="2" />
  <text x="60" y="671" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="15" font-weight="650">ARTIFACT TRUST IS ONE LAYER</text>
  <text x="60" y="709" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="22" font-weight="400">Published bytes and workspace integrity have separate evidence.</text>
  <text x="60" y="739" fill="#1A1A1A" font-family="Sora, Arial, sans-serif" font-size="19" font-weight="400">Neither signature nor checksum establishes the truth of stored claims.</text>
  <text x="38" y="803" fill="#5B3EE0" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="650">INSTALLER LIMIT</text>
  <text x="38" y="837" fill="#5F596B" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="400">The convenience script can continue when verification is unavailable or fails.</text>
<text x="38" y="888" fill="#5F596B" font-family="Arial, sans-serif" font-size="20">Manual policy: stop if either check is missing or fails.</text>
</svg>
