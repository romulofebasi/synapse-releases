name: npm publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified stable release tag, for example v1.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: resolve tag
        id: v
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          python3 scripts/publish-npm.py resolve --tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: sigstore/cosign-installer@v3
      - name: download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          python3 scripts/publish-npm.py download --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: assemble + publish (OIDC)
        env:
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          python3 scripts/publish-npm.py publish --tag "$RELEASE_TAG"
